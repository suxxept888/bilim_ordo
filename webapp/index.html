<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bilim Ordo</title>
  <!-- Библиотека Telegram для мини-приложений -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <button class="back" id="back" type="button" aria-label="Назад" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <a class="logo" href="#home">Bilim Ordo</a>
      </div>
      <!-- Меню в шапке: видно только на компьютере -->
      <nav class="top-nav">
        <a href="#home" data-tab="home">Главная</a>
        <a href="#teachers" data-tab="teachers">Преподаватели</a>
        <a href="#upload" data-tab="upload">Загрузить урок</a>
      </nav>
    </div>
  </header>

  <!-- Сюда app.js подставляет текущий экран -->
  <main id="screen"></main>

  <!-- Нижнее меню: видно только на телефоне -->
  <nav class="tabs">
    <a href="#home" data-tab="home">Главная</a>
    <a href="#teachers" data-tab="teachers">Преподаватели</a>
    <a href="#upload" data-tab="upload">Загрузить урок</a>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
