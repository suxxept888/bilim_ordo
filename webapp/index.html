<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bilim Ordo</title>
  <!-- Библиотека Telegram для мини-приложений -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <!-- ?v=8 — номер версии: при изменении файлов увеличивайте его, чтобы браузер не показывал старую копию -->
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <button class="back" id="back" type="button" aria-label="Назад" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <a class="logo" href="#home">Bilim Ordo</a>
      </div>
      <!-- Меню в шапке (компьютер) и кнопка справа (телефон): пункты зависят от того, вошёл ли ученик -->
      <nav class="top-nav" id="top-nav"></nav>
      <div class="top-right" id="top-right"></div>
    </div>
  </header>

  <!-- Сюда app.js подставляет текущий экран -->
  <main id="screen"></main>

  <!-- Нижнее меню: видно только на телефоне -->
  <nav class="tabs" id="tabs"></nav>

  <script src="data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
